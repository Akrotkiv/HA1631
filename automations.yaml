- id: aquarium_manual_override_detection
  alias: Akvárium - Detekcia manuálneho zásahu
  description: Aktivuje manual override LEN ak zmenu vykonal používateľ (nie automatizácia).
    Používa context.user_id - ak je None, zmenu vyvolala automatizácia/script.
  mode: single
  trigger:
  - platform: state
    entity_id: light.led_ccww_controller
    from: 'off'
    to: 'on'
  - platform: state
    entity_id: light.led_ccww_controller
    from: 'on'
    to: 'off'
  condition:
  - condition: state
    entity_id: input_boolean.aquarium_automation
    state: 'on'
  - condition: state
    entity_id: input_boolean.aquarium_manual_override
    state: 'off'
  - condition: template
    value_template: '{{ trigger.to_state.context.user_id is not none }}'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.aquarium_manual_override
  - service: input_number.set_value
    target:
      entity_id: input_number.aquarium_last_brightness
    data:
      value: '{{ state_attr(''light.led_ccww_controller'', ''brightness'') | int(255)
        }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.aquarium_last_color_temp
    data:
      value: '{{ state_attr(''light.led_ccww_controller'', ''color_temp'') | int(250)
        }}'
  - service: persistent_notification.create
    data:
      title: Akvárium
      message: "\U0001F7E1 Detekovaný manuálny zásah - automatizácia pozastavená do
        nasledujúceho časového slotu."
      notification_id: aquarium_manual
  - service: logbook.log
    data:
      name: Akvárium
      message: "\U0001F7E1 Manual override aktivovaný (zmenu spustil používateľ)"
- id: aquarium_auto_resume
