  - condition: state
    entity_id: input_boolean.tariff_system_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.klima_manual_override
    state: 'off'
  - condition: state
    entity_id: switch.klima_cojirbfaaai_power_switch
    state: 'on'
  - condition: template
    value_template: "{% set t1_active = is_state('binary_sensor.t1_aktivna', 'on')
      %} {% set t2_active = is_state('binary_sensor.t2_aktivna', 'on') %} {% set t3_active
      = is_state('binary_sensor.t3_aktivna', 'on') %} {% set t4_active = is_state('binary_sensor.t4_aktivna',
      'on') %} {% set t1_allowed = is_state('input_boolean.klima_enable_t1', 'on')
      %} {% set t2_allowed = is_state('input_boolean.klima_enable_t2', 'on') %} {%
      set t3_allowed = is_state('input_boolean.klima_enable_t3', 'on') %} {% set t4_allowed
      = is_state('input_boolean.klima_enable_t4', 'on') %} {{ (t1_active and not t1_allowed)\n
      \  or (t2_active and not t2_allowed)\n   or (t3_active and not t3_allowed)\n
      \  or (t4_active and not t4_allowed) }}"
