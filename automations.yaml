- id: cost_tracking_klima_update
  alias: Náklady - Klíma aktualizácia
  description: Každých 5 minút počíta náklady klímy podľa aktuálnej tarify
  mode: single
  trigger:
  - platform: time_pattern
    minutes: /5
  condition:
  - condition: state
    entity_id: input_boolean.cost_tracking_enabled
    state: 'on'
  - condition: state
    entity_id: switch.klima_cojirbfaaai_power_switch
    state: 'on'
  action:
  - variables:
      klima_power_kw: '{% set energy_today = states(''sensor.klima_cojirbfaaai_today_energy_consumption'')
        | float(0) %} {% set work_time_min = states(''sensor.klima_cojirbfaaai_today_work_time'')
        | float(1) %} {% if work_time_min > 0 %}{{ (energy_today / (work_time_min
        / 60)) }} {% else %}1.0 {% endif %}'
      energy_5min: '{{ (klima_power_kw | float(1.0) * 5 / 60) | round(4) }}'
      price_kwh: '{{ state_attr(''sensor.aktualna_tarifa'', ''price_eur_kwh'') | float(0)
        }}'
      cost_5min: '{{ (energy_5min | float(0) * price_kwh | float(0)) | round(5) }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.cost_daily_klima
    data:
      value: '{{ (states(''input_number.cost_daily_klima'') | float(0) + cost_5min
        | float(0)) | round(3) }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.cost_monthly_klima
    data:
      value: '{{ (states(''input_number.cost_monthly_klima'') | float(0) + cost_5min
        | float(0)) | round(3) }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.energy_daily_klima
    data:
      value: '{{ (states(''input_number.energy_daily_klima'') | float(0) + energy_5min
        | float(0)) | round(3) }}'
- id: cost_tracking_drazice_update
  alias: Náklady - Dražice aktualizácia
  description: Každých 5 minút počíta náklady Dražice keď hrieva (2000W)
  mode: single
  trigger:
  - platform: time_pattern
    minutes: /5
  condition:
  - condition: state
    entity_id: input_boolean.cost_tracking_enabled
    state: 'on'
  - condition: state
    entity_id: climate.drazitherm
    state: heat
  action:
  - variables:
      drazice_power_kw: 2.0
      energy_5min: '{{ (drazice_power_kw * 5 / 60) | round(4) }}'
      price_kwh: '{{ state_attr(''sensor.aktualna_tarifa'', ''price_eur_kwh'') | float(0)
        }}'
      cost_5min: '{{ (energy_5min * price_kwh) | round(5) }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.cost_daily_bojler_drazice
    data:
      value: '{{ (states(''input_number.cost_daily_bojler_drazice'') | float(0) +
        cost_5min) | round(3) }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.cost_monthly_bojler_drazice
    data:
      value: '{{ (states(''input_number.cost_monthly_bojler_drazice'') | float(0)
        + cost_5min) | round(3) }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.energy_daily_bojler_drazice
    data:
      value: '{{ (states(''input_number.energy_daily_bojler_drazice'') | float(0)
        + energy_5min) | round(3) }}'
- id: cost_tracking_ariston_update
  alias: Náklady - Ariston aktualizácia
  description: Každých 5 minút počíta náklady Ariston keď je zapnutý
  mode: single
  trigger:
  - platform: time_pattern
    minutes: /5
  condition:
  - condition: state
    entity_id: input_boolean.cost_tracking_enabled
    state: 'on'
  - condition: state
    entity_id: switch.pw_bojler_immax
    state: 'on'
  action:
  - variables:
      ariston_power_w: '{{ states(''sensor.pw_bojler_immax_power'') | float(0) }}'
      ariston_power_kw: '{{ (ariston_power_w / 1000) }}'
      energy_5min: '{{ (ariston_power_kw | float(0) * 5 / 60) | round(4) }}'
      price_kwh: '{{ state_attr(''sensor.aktualna_tarifa'', ''price_eur_kwh'') | float(0)
        }}'
      cost_5min: '{{ (energy_5min | float(0) * price_kwh) | round(5) }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.cost_daily_bojler_ariston
    data:
      value: '{{ (states(''input_number.cost_daily_bojler_ariston'') | float(0) +
        cost_5min | float(0)) | round(3) }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.cost_monthly_bojler_ariston
    data:
      value: '{{ (states(''input_number.cost_monthly_bojler_ariston'') | float(0)
        + cost_5min | float(0)) | round(3) }}'
  - service: input_number.set_value
    target:
      entity_id: input_number.energy_daily_bojler_ariston
    data:
      value: '{{ (states(''input_number.energy_daily_bojler_ariston'') | float(0)
        + energy_5min | float(0)) | round(3) }}'
- id: cost_tracking_daily_reset
  alias: Náklady - Denný reset
  description: O polnoci resetuje denné počítadlá nákladov
  mode: single
  trigger:
  - platform: time
    at: 00:00:00
  action:
  - service: input_number.set_value
    target:
      entity_id:
      - input_number.cost_daily_klima
      - input_number.cost_daily_bojler_drazice
      - input_number.cost_daily_bojler_ariston
      - input_number.energy_daily_klima
      - input_number.energy_daily_bojler_drazice
      - input_number.energy_daily_bojler_ariston
    data:
      value: 0
  - service: logbook.log
    data:
      name: Cost Tracking
      message: "\U0001F504 Denné počítadlá nákladov resetované"
- id: cost_tracking_monthly_reset
  alias: Náklady - Mesačný reset
  description: Na začiatku mesiaca resetuje mesačné počítadlá
  mode: single
  trigger:
  - platform: time
    at: 00:00:05
  condition:
  - condition: template
    value_template: '{{ now().day == 1 }}'
  action:
  - service: logbook.log
    data:
      name: Cost Tracking
      message: "\U0001F4CA Mesačný report - Klíma: {{ states('input_number.cost_monthly_klima')
        | round(2) }} EUR, Dražice: {{ states('input_number.cost_monthly_bojler_drazice')
        | round(2) }} EUR, Ariston: {{ states('input_number.cost_monthly_bojler_ariston')
        | round(2) }} EUR"
  - service: input_number.set_value
    target:
      entity_id:
      - input_number.cost_monthly_klima
      - input_number.cost_monthly_bojler_drazice
      - input_number.cost_monthly_bojler_ariston
    data:
      value: 0
- id: vetranie_co2_high
  alias: Vetranie - CO2 vysoké - zvýšiť
  description: Pri vysokom CO2 zvýši stupeň vetrania
  mode: single
  trigger:
  - platform: numeric_state
    entity_id: sensor.wifi_smart_switch_carbon_dioxide
    above: input_number.vetranie_co2_threshold_high
    for:
      minutes: 2
  condition:
  - condition: state
    entity_id: input_boolean.vetranie_co2_auto_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.vetranie_forced_off
    state: 'off'
  - condition: template
    value_template: "{{ states('input_number.vetranie_stupen') | int\n   < states('input_number.vetranie_co2_stupen')
      | int }}"
  action:
  - service: script.vetranie_nastav_stupen
    data:
      stupen: '{{ states(''input_number.vetranie_co2_stupen'') | int }}'
  - service: logbook.log
    data:
      name: Vetranie CO2
      message: ⬆️ CO2 vysoké ({{ states('sensor.wifi_smart_switch_carbon_dioxide')
        }} ppm) - stupeň zvýšený na {{ states('input_number.vetranie_co2_stupen')
        }}
- id: vetranie_co2_low
  alias: Vetranie - CO2 nízke - znížiť
  description: Pri nízkom CO2 vráti stupeň vetrania na predchádzajúci
  mode: single
  trigger:
  - platform: numeric_state
    entity_id: sensor.wifi_smart_switch_carbon_dioxide
    below: input_number.vetranie_co2_threshold_low
    for:
      minutes: 5
  condition:
  - condition: state
    entity_id: input_boolean.vetranie_co2_auto_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.vetranie_forced_off
    state: 'off'
  - condition: template
    value_template: '{{ states(''input_number.vetranie_stupen'') | int > 1 }}'
  action:
  - service: script.vetranie_nastav_stupen
    data:
      stupen: 1
  - service: logbook.log
    data:
      name: Vetranie CO2
      message: ⬇️ CO2 nízke ({{ states('sensor.wifi_smart_switch_carbon_dioxide')
        }} ppm) - stupeň znížený na 1
- id: vetranie_forced_off_activated
  alias: Vetranie - Forced OFF aktivované
  description: Pri zapnutí forced_off uloží aktuálny stupeň a vypne vetranie na 0
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.vetranie_forced_off
    to: 'on'
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.vetranie_stupen_pred_forced_off
    data:
      value: '{{ states(''input_number.vetranie_stupen'') | int(0) }}'
  - service: script.vetranie_nastav_stupen
    data:
      stupen: 0
  - service: logbook.log
    data:
      name: Vetranie
      message: "\U0001F6D1 Vynútené vypnutie vetrania (bol stupeň {{ states('input_number.vetranie_stupen_pred_forced_off')
        }})"
  - service: persistent_notification.create
    data:
      title: "\U0001F4A8 Vetranie - Vynútené vypnutie"
      message: Vetranie je vynútene vypnuté (bol stupeň {{ states('input_number.vetranie_stupen_pred_forced_off')
        }}). {% if is_state('input_boolean.vetranie_auto_restart_enabled', 'on') %}
        Automatický reštart o {{ states('input_datetime.vetranie_auto_restart_time')
        }} na stupeň {{ states('input_number.vetranie_auto_restart_stupen') | int
        }}. {% else %} Automatický reštart nie je nastavený. {% endif %}
      notification_id: vetranie_forced_off
- id: vetranie_forced_off_deactivated
  alias: Vetranie - Forced OFF deaktivované
  description: Pri vypnutí forced_off obnoví normálnu prevádzku
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.vetranie_forced_off
    to: 'off'
  action:
  - service: persistent_notification.dismiss
    data:
      notification_id: vetranie_forced_off
  - service: logbook.log
    data:
      name: Vetranie
      message: ✅ Vynútené vypnutie zrušené - automatizácia obnovená
- id: vetranie_auto_restart
  alias: Vetranie - Automatický reštart po forced off
  description: V nastavenom čase vypne forced_off a nastaví požadovaný stupeň
  mode: single
  trigger:
  - platform: time
    at: input_datetime.vetranie_auto_restart_time
  condition:
  - condition: state
    entity_id: input_boolean.vetranie_forced_off
    state: 'on'
  - condition: state
    entity_id: input_boolean.vetranie_auto_restart_enabled
    state: 'on'
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.vetranie_forced_off
  - delay:
      seconds: 2
  - service: script.vetranie_nastav_stupen
    data:
      stupen: '{{ states(''input_number.vetranie_auto_restart_stupen'') | int }}'
  - service: logbook.log
    data:
      name: Vetranie
      message: "\U0001F504 Automatický reštart vetrania - stupeň {{ states('input_number.vetranie_auto_restart_stupen')
        }}"
  - service: persistent_notification.dismiss
    data:
      notification_id: vetranie_forced_off
- id: klima_health_switch_on
  alias: Klíma - Zapnúť Health pri zapnutí klímy
  description: Pri zapnutí klimatizácie automaticky zapne aj Health (Healthy) prepínač
  mode: single
  trigger:
  - platform: state
    entity_id: switch.klima_cojirbfaaai_power_switch
    to: 'on'
  action:
  - delay:
      seconds: 3
  - service: switch.turn_on
    target:
      entity_id: switch.klima_cojirbfaaai_healthy_switch
  - service: logbook.log
    data:
      name: Klíma
      message: "\U0001F3E5 Health prepínač automaticky zapnutý spolu s klimatizáciou"
- id: sw_outdoor_lidl_surplus
  alias: Outdoor Lidl - Zapínanie pri prebytkoch
  description: Zapne sw_outdoor_lidl keď sú prebytky ≥100W po 15 min, vypne keď klesnú
    pod 0W po 15 min.
  mode: single
  trigger:
  - platform: numeric_state
    entity_id: sensor.gw_surplus
    above: 100
    for:
      minutes: 15
    id: surplus_on
  - platform: numeric_state
    entity_id: sensor.gw_surplus
    below: 0
    for:
      minutes: 15
    id: surplus_off
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: surplus_on
      - condition: state
        entity_id: switch.sw_outdoor_lidl
        state: 'off'
      sequence:
      - service: switch.turn_on
        target:
          entity_id: switch.sw_outdoor_lidl
      - service: logbook.log
        data:
          name: Outdoor Lidl
          message: "\U0001F7E2 Zapnutý - prebytky {{ states('sensor.gw_surplus') }}W
            (≥100W stabilne 15 min)"
    - conditions:
      - condition: trigger
        id: surplus_off
      - condition: state
        entity_id: switch.sw_outdoor_lidl
        state: 'on'
      sequence:
      - service: switch.turn_off
        target:
          entity_id: switch.sw_outdoor_lidl
      - service: logbook.log
        data:
          name: Outdoor Lidl
          message: "\U0001F534 Vypnutý - prebytky {{ states('sensor.gw_surplus') }}W
            (<0W stabilne 15 min)"
- id: kvetiny_alarm_set
  alias: Kvety - Nastav alarm boolean
  description: Zapne/vypne input_boolean.kvetiny_alarm podla vlhkosti
  triggers:
  - entity_id:
    - sensor.plant_sensor_b3e2_moisture
    below: 9
    id: alarm_on
    trigger: numeric_state
  - entity_id: sensor.plant_sensor_b3c1_moisture
    below: 20
    id: alarm_on
    trigger: numeric_state
  - entity_id:
    - sensor.flowersoil_soil_moisture
    below: 1
    id: alarm_on
    trigger: numeric_state
  - entity_id: sensor.flowersoil_water_warning
    to: alarm
    id: alarm_on
    trigger: state
  - entity_id:
    - sensor.plant_sensor_b3e2_moisture
    above: 20
    id: alarm_off
    trigger: numeric_state
  - entity_id: sensor.plant_sensor_b3c1_moisture
    above: 25
    id: alarm_off
    trigger: numeric_state
  - entity_id: sensor.flowersoil_soil_moisture
    above: 5
    id: alarm_off
    trigger: numeric_state
  - entity_id: sensor.flowersoil_water_warning
    to: ok
    id: alarm_off
    trigger: state
  - event: start
    id: alarm_off
    trigger: homeassistant
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''alarm_on'' }}'
      sequence:
      - target:
          entity_id: input_boolean.kvetiny_alarm
        action: input_boolean.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''alarm_off'' }}'
      sequence:
      - condition: template
        value_template: '{% set b3e2 = states(''sensor.plant_sensor_b3e2_moisture'')
          | float(100) %} {% set b3c1 = states(''sensor.plant_sensor_b3c1_moisture'')
          | float(100) %} {% set soil = states(''sensor.flowersoil_soil_moisture'')
          | float(100) %} {% set warn = states(''sensor.flowersoil_water_warning'')
          %} {{ b3e2 >= 25 and b3c1 >= 25 and soil >= 5 and warn != ''alarm'' }}

          '
      - target:
          entity_id: input_boolean.kvetiny_alarm
        action: input_boolean.turn_off
  mode: single
- id: kvetiny_notifikacia_vlhkost
  alias: Kvety - Notifikácia nízkej vlhkosti
  description: Upozorní keď treba kvety zalievať
  triggers:
  - entity_id: sensor.flowersoil_water_warning
    to: alarm
    id: flowersoil_alarm
    trigger: state
  - entity_id: sensor.plant_sensor_b3e2_moisture
    below: 9
    for:
      minutes: 10
    id: b3e2_low
    trigger: numeric_state
  - entity_id: sensor.plant_sensor_b3c1_moisture
    below: 20
    for:
      minutes: 10
    id: b3c1_low
    trigger: numeric_state
  actions:
  - data:
      title: "\U0001F331 Kvety - Treba zalievať"
      message: "{% if trigger.id == 'flowersoil_alarm' %} \U0001F4A7 FlowerSoil: Nízka
        vlhkosť pôdy - treba zalievať! {% elif trigger.id == 'b3e2_low' %} \U0001F4A7
        Kvetináč B3E2: Vlhkosť {{ states('sensor.plant_sensor_b3e2_moisture') }}%
        - treba zalievať! {% elif trigger.id == 'b3c1_low' %} \U0001F4A7 Kvetináč
        B3C1: Vlhkosť {{ states('sensor.plant_sensor_b3c1_moisture') }}% - treba zalievať!
        {% endif %}"
      notification_id: kvetiny_low_moisture
    action: persistent_notification.create
  - target:
      entity_id:
      - notify.sm_s911b
      - notify.iphone
    data:
      title: "\U0001F331 Kvety - Treba zalievať"
      message: "{% if trigger.id == 'flowersoil_alarm' %} \U0001F4A7 FlowerSoil: Nízka
        vlhkosť pôdy! {% elif trigger.id == 'b3e2_low' %} \U0001F4A7 Kvetináč B3E2:
        Vlhkosť {{ states('sensor.plant_sensor_b3e2_moisture') }}% {% elif trigger.id
        == 'b3c1_low' %} \U0001F4A7 Kvetináč B3C1: Vlhkosť {{ states('sensor.plant_sensor_b3c1_moisture')
        }}% {% endif %}"
    continue_on_error: true
    action: notify.send_message
  mode: single
- id: '1775680876612'
  alias: Vetranie - 22:00 [4]
  description: ''
  mode: single
  triggers:
  - at: '22:00:00'
    trigger: time
  conditions:
  - condition: state
    entity_id: input_boolean.vetranie_forced_off
    state: 'off'
  actions:
  - action: script.vetranie_nastav_stupen
    data:
      stupen: 4
