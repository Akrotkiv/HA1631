      message: "\U0001F535 Automatizácia obnovená - spúšťa sa časový slot"
- id: aquarium_restore_after_restart
  alias: Akvárium - Catch-up po reštarte
  description: Po reštarte HA zistí podľa aktuálneho času ktorý slot mal bežať a nastaví
    svetlo správne - aj keď bol pri reštarte vypnutý.
  mode: single
  trigger:
  - platform: homeassistant
    event: start
  condition:
  - condition: state
    entity_id: input_boolean.aquarium_automation
    state: 'on'
  - condition: state
    entity_id: input_boolean.aquarium_manual_override
    state: 'off'
  action:
  - delay:
      seconds: 60
  - variables:
      t: '{{ now().strftime(''%H:%M:%S'') }}'
      s1: '{{ states(''input_datetime.aquarium_slot1_time'') }}'
      s2: '{{ states(''input_datetime.aquarium_slot2_time'') }}'
      s3: '{{ states(''input_datetime.aquarium_slot3_time'') }}'
      s4: '{{ states(''input_datetime.aquarium_slot4_time'') }}'
      s5: '{{ states(''input_datetime.aquarium_slot5_time'') }}'
      e1: '{{ is_state(''input_boolean.aquarium_slot1_enabled'', ''on'') }}'
      e2: '{{ is_state(''input_boolean.aquarium_slot2_enabled'', ''on'') }}'
      e3: '{{ is_state(''input_boolean.aquarium_slot3_enabled'', ''on'') }}'
      e4: '{{ is_state(''input_boolean.aquarium_slot4_enabled'', ''on'') }}'
      e5: '{{ is_state(''input_boolean.aquarium_slot5_enabled'', ''on'') }}'
      active_brightness: '{% set t = now().strftime(''%H:%M:%S'') %} {% set s1 = states(''input_datetime.aquarium_slot1_time'')
        %} {% set s2 = states(''input_datetime.aquarium_slot2_time'') %} {% set s3
        = states(''input_datetime.aquarium_slot3_time'') %} {% set s4 = states(''input_datetime.aquarium_slot4_time'')
        %} {% set s5 = states(''input_datetime.aquarium_slot5_time'') %} {% if t >=
        s5 and is_state(''input_boolean.aquarium_slot5_enabled'',''on'') %}0 {% elif
        t >= s4 and is_state(''input_boolean.aquarium_slot4_enabled'',''on'') %}{{
        states(''input_number.aquarium_slot4_brightness'') | int }} {% elif t >= s3
        and is_state(''input_boolean.aquarium_slot3_enabled'',''on'') %}{{ states(''input_number.aquarium_slot3_brightness'')
        | int }} {% elif t >= s2 and is_state(''input_boolean.aquarium_slot2_enabled'',''on'')
        %}{{ states(''input_number.aquarium_slot2_brightness'') | int }} {% elif t
        >= s1 and is_state(''input_boolean.aquarium_slot1_enabled'',''on'') %}{{ states(''input_number.aquarium_slot1_brightness'')
        | int }} {% else %}0 {% endif %}

        '
  - service: script.aquarium_light_control
    data:
      brightness: '{{ active_brightness | int }}'
      color_temp: '{{ states(''input_number.aquarium_color_temp'') | int }}'
      transition: 5
      slot_name: Catch-up po reštarte ({{ now().strftime('%H:%M') }})
- alias: Dražice - Nastavenie režimu
  id: c17f02a921464407946209c63afbc7ef
  description: Automaticky nastaví režim a teplotu termostatu podľa podmienok
  mode: restart
  trigger:
  - platform: time_pattern
    minutes: /5
  - platform: state
    entity_id: sensor.active_power
  - platform: state
    entity_id:
    - binary_sensor.t1_aktivna
    - binary_sensor.t2_aktivna
    - binary_sensor.t3_aktivna
    - binary_sensor.t4_aktivna
  - platform: state
    entity_id: climate.drazitherm
    attribute: current_temperature
  - platform: homeassistant
    event: start
  condition:
  - condition: state
    entity_id: input_boolean.tariff_system_enabled
    state: 'on'
  action:
  - variables:
      recommended_mode: '{{ states(''sensor.drazice_odporucany_rezim'') }}'
      current_mode: '{{ states(''input_select.bojler_drazice_mode'') }}'
      target_temp: '{{ state_attr(''sensor.drazice_odporucany_rezim'', ''target_temperature'')
        | float(45) }}'
      current_temp: '{{ state_attr(''climate.drazitherm'', ''current_temperature'')
        | float(50) }}'
  - condition: template
    value_template: '{{ recommended_mode != current_mode }}'
  - service: input_select.select_option
    target:
      entity_id: input_select.bojler_drazice_mode
    data:
      option: '{{ recommended_mode }}'
  - service: climate.set_temperature
    target:
      entity_id: climate.drazitherm
    data:
      temperature: '{{ target_temp }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ current_temp < target_temp }}'
      sequence:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.drazitherm
        data:
          hvac_mode: heat
  - service: input_select.select_option
    target:
      entity_id: input_select.bojler_drazice_start_reason
    data:
      option: '{% if is_state(''binary_sensor.drazice_forced_needed'', ''on'') %}forced
        {% elif states(''sensor.active_power'') | float(0) > states(''input_number.bojler_drazice_surplus_threshold_boost'')
        | float(2500) %}surplus {% elif is_state(''binary_sensor.t1_aktivna'', ''on'')
        %}t1 {% elif is_state(''binary_sensor.t2_aktivna'', ''on'') %}t2 {% elif is_state(''binary_sensor.t3_aktivna'',
        ''on'') %}t3 {% else %}forced {% endif %}'
  - service: logbook.log
    data:
      name: Dražice Termostat
      message: "\U0001F504 Režim zmenený: {{ current_mode }} → {{ recommended_mode
        }} \U0001F321️ Cieľová teplota: {{ target_temp }}°C \U0001F4CA {{ state_attr('sensor.drazice_odporucany_rezim',
        'reason') }}"
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.bojler_drazice_start_time
    data:
      timestamp: '{{ now().timestamp() }}'
- alias: Dražice - Vynútený ohrev
  id: 7d8e68fa529b4800b0aaefdcbbdfa4aa
  description: Zapne ohrev ak teplota klesne pod minimum
  mode: single
  trigger:
  - platform: numeric_state
    entity_id: climate.drazitherm
    attribute: current_temperature
    below: input_number.bojler_drazice_temp_forced
  condition:
  - condition: state
    entity_id: input_boolean.tariff_system_enabled
    state: 'on'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.bojler_drazice_forced_mode
  - service: climate.set_temperature
    target:
      entity_id: climate.drazitherm
    data:
      temperature: '{{ states(''input_number.bojler_drazice_temp_forced'') }}'
  - service: climate.set_hvac_mode
    target:
      entity_id: climate.drazitherm
    data:
      hvac_mode: heat
  - service: persistent_notification.create
    data:
      title: ⚠️ Dražice - Vynútený režim
      message: Teplota bojlera klesla pod {{ states('input_number.bojler_drazice_temp_forced')
        }}°C. Zapnutý vynútený ohrev.
      notification_id: drazice_forced
  - service: logbook.log
    data:
      name: Dražice Termostat
      message: "\U0001F6A8 VYNÚTENÝ REŽIM: Teplota {{ state_attr('climate.drazitherm',
        'current_temperature') }}°C - zapnutý ohrev"
- alias: Dražice - Vypnutie vynúteného režimu
  id: 255c342427664ed68cb47282b981758c
  description: Vypne vynútený režim keď je teplota dostatočná
  mode: single
  trigger:
  - platform: numeric_state
    entity_id: climate.drazitherm
    attribute: current_temperature
    above: input_number.bojler_drazice_temp_forced
    for:
      minutes: 10
  condition:
  - condition: state
    entity_id: input_boolean.bojler_drazice_forced_mode
    state: 'on'
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.bojler_drazice_forced_mode
  - service: persistent_notification.dismiss
    data:
      notification_id: drazice_forced
  - service: logbook.log
    data:
      name: Dražice Termostat
      message: '✅ Vynútený režim ukončený - teplota: {{ state_attr(''climate.drazitherm'',
        ''current_temperature'') }}°C'
- alias: Ariston - Flexibilné zapnutie
  id: ariston_flexible_on
  description: Zapína Ariston len ak je Dražice zohriaty alebo sú veľké prebytky
  mode: single
  trigger:
  - platform: template
    value_template: "{{ is_state('input_boolean.bojler_ariston_enable_surplus', 'on')\n
      \  and states('sensor.active_power') | float(0)\n       > states('input_number.bojler_ariston_surplus_threshold_on')
      | float(2000) }}"
    id: surplus_enabled
  - platform: state
    entity_id: binary_sensor.t1_aktivna
    to: 'on'
    id: t1_start
  - platform: state
    entity_id: binary_sensor.t2_aktivna
    to: 'on'
    id: t2_start
  - platform: state
    entity_id: binary_sensor.t3_aktivna
    to: 'on'
    id: t3_start
  - platform: state
    entity_id: binary_sensor.t4_aktivna
    to: 'on'
    id: t4_start
  condition:
  - condition: state
    entity_id: switch.pw_bojler_immax
    state: 'off'
  - condition: state
    entity_id: input_boolean.tariff_system_enabled
    state: 'on'
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: state
        entity_id: binary_sensor.drazice_zohriaty
        state: 'on'
      - condition: state
        entity_id: input_boolean.bojler_ariston_enable_surplus
        state: 'on'
      - condition: template
        value_template: "{{ states('sensor.active_power') | float(0)\n   > states('input_number.bojler_ariston_surplus_threshold_on')
          | float(2000) }}"
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.bojler_ariston_enable_surplus
        state: 'on'
      - condition: template
        value_template: "{{ states('sensor.active_power') | float(0)\n   > states('input_number.combined_surplus_threshold')
          | float(3600) }}"
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.bojler_ariston_enable_t1
        state: 'on'
      - condition: state
        entity_id: binary_sensor.t1_aktivna
        state: 'on'
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.bojler_ariston_enable_t2
        state: 'on'
      - condition: state
        entity_id: binary_sensor.t2_aktivna
        state: 'on'
      - condition: state
        entity_id: binary_sensor.drazice_zohriaty
        state: 'on'
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.bojler_ariston_enable_t3
        state: 'on'
      - condition: state
        entity_id: binary_sensor.t3_aktivna
        state: 'on'
      - condition: state
        entity_id: binary_sensor.drazice_zohriaty
        state: 'on'
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.bojler_ariston_enable_t4
        state: 'on'
      - condition: state
        entity_id: binary_sensor.t4_aktivna
        state: 'on'
      - condition: state
        entity_id: binary_sensor.drazice_zohriaty
        state: 'on'
  action:
  - service: switch.turn_on
    target:
      entity_id: switch.pw_bojler_immax
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.bojler_ariston_start_time
    data:
      timestamp: '{{ now().timestamp() }}'
  - service: input_select.select_option
    target:
      entity_id: input_select.bojler_ariston_start_reason
    data:
      option: '{% set surplus = states(''sensor.active_power'') | float(0) %} {% set
        drazice_ready = is_state(''binary_sensor.drazice_zohriaty'', ''on'') %} {%
        set combined_threshold = states(''input_number.combined_surplus_threshold'')
        | float(3600) %} {% if surplus > combined_threshold %}surplus {% elif drazice_ready
        and surplus > states(''input_number.bojler_ariston_surplus_threshold_on'')
        | float(2000) %}drazice_ready {% elif is_state(''binary_sensor.t1_aktivna'',
        ''on'') %}t1 {% elif is_state(''binary_sensor.t2_aktivna'', ''on'') %}t2 {%
        elif is_state(''binary_sensor.t3_aktivna'', ''on'') %}t3 {% elif is_state(''binary_sensor.t4_aktivna'',
        ''on'') %}t4 {% else %}none {% endif %}'
  - service: logbook.log
    data:
      name: Ariston Bojler
      message: "\U0001F7E2 Ariston zapnutý: {% set surplus = states('sensor.active_power')
        | float(0) %} {% set reason = states('input_select.bojler_ariston_start_reason')
        %} {% if reason == 'surplus' %}Veľké prebytky ({{ surplus }}W) - oba bojlery
        súčasne {% elif reason == 'drazice_ready' %}Dražice zohriaty + prebytky ({{
        surplus }}W) {% elif reason == 't1' %}T1 tarifa aktívna {% elif reason ==
        't2' %}T2 tarifa + Dražice zohriaty {% elif reason == 't3' %}T3 tarifa + Dražice
        zohriaty {% elif reason == 't4' %}T4 tarifa + Dražice zohriaty {% else %}Neznámy
        dôvod {% endif %}"
- alias: Ariston - Flexibilné vypnutie
  id: ariston_flexible_off
  description: Vypína Ariston - pri prebytkoch po min.čase, pri tarife až keď príde
    zakázaná tarifa
  mode: single
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.t1_aktivna
    - binary_sensor.t2_aktivna
    - binary_sensor.t3_aktivna
    - binary_sensor.t4_aktivna
    to: 'on'
    id: tariff_change
  - platform: template
    value_template: "{{ states('sensor.active_power') | float(0)\n   < states('input_number.bojler_ariston_surplus_threshold_off')
      | float(500) }}"
    for:
      minutes: 2
    id: surplus_low
  - platform: time_pattern
    minutes: /5
    id: periodic_check
  condition:
  - condition: state
    entity_id: switch.pw_bojler_immax
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.bojler_ariston_start_reason
      state: manual
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.bojler_ariston_start_reason
      state: none
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: template
        value_template: "{{ states('input_select.bojler_ariston_start_reason')\n   in
          ['surplus', 'drazice_ready'] }}"
      - condition: template
        value_template: "{{ states('sensor.active_power') | float(0)\n   < states('input_number.bojler_ariston_surplus_threshold_off')
          | float(500) }}"
      - condition: template
        value_template: '{% set start = states(''input_datetime.bojler_ariston_start_time'')
          | as_timestamp %} {% set mins = (now().timestamp() - start) / 60 %} {{ mins
          >= states(''input_number.bojler_ariston_min_time'') | float(15) }}'
    - condition: and
      conditions:
      - condition: template
        value_template: "{{ states('input_select.bojler_ariston_start_reason')\n   in
          ['t1', 't2', 't3', 't4'] }}"
      - condition: template
        value_template: "{% set t1_ok = is_state('binary_sensor.t1_aktivna', 'on')\n
          \              and is_state('input_boolean.bojler_ariston_enable_t1', 'on')
          %}\n{% set t2_ok = is_state('binary_sensor.t2_aktivna', 'on')\n               and
          is_state('input_boolean.bojler_ariston_enable_t2', 'on') %}\n{% set t3_ok
          = is_state('binary_sensor.t3_aktivna', 'on')\n               and is_state('input_boolean.bojler_ariston_enable_t3',
          'on') %}\n{% set t4_ok = is_state('binary_sensor.t4_aktivna', 'on')\n               and
          is_state('input_boolean.bojler_ariston_enable_t4', 'on') %}\n{% set surplus_ok
          = is_state('input_boolean.bojler_ariston_enable_surplus', 'on')\n                     and
          states('sensor.active_power') | float(0)\n                         > states('input_number.bojler_ariston_surplus_threshold_on')
          | float(2000) %}\n{{ not (t1_ok or t2_ok or t3_ok or t4_ok or surplus_ok)
          }}"
  action:
  - service: switch.turn_off
    target:
      entity_id: switch.pw_bojler_immax
  - service: input_select.select_option
    target:
      entity_id: input_select.bojler_ariston_start_reason
    data:
      option: none
  - service: logbook.log
    data:
      name: Ariston Bojler
      message: "\U0001F534 Ariston vypnutý: {% set start_time = states('input_datetime.bojler_ariston_start_time')
        | as_timestamp %} {% set current_time = now().timestamp() %} {% set running_minutes
        = ((current_time - start_time) / 60) | round(1) %} {% set power = states('sensor.active_power')
        | float(0) %} Bežal {{ running_minutes }} min, aktuálny výkon: {{ power }}W"
