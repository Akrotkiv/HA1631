      message: Klíma vypnutá - tarifa {{ states('sensor.aktualna_tarifa') }} ({{ states('sensor.aktualna_cena_kwh')
        }} EUR/kWh). Automaticky sa zapne po skončení tejto tarify.
      notification_id: klima_tariff_shutoff
  - service: logbook.log
    data:
      name: Klíma Automatizácia
      message: "\U0001F534 Klíma VYPNUTÁ - {{ states('sensor.aktualna_tarifa') }}"
