- alias: Tarifa - Aktualizácia aktuálnej tarify
  id: 4986e5e97eaa46d78558b634d8e4f1ce
  description: Automaticky aktualizuje select s aktuálnou tarifou
  mode: single
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.t1_aktivna
    - binary_sensor.t2_aktivna
    - binary_sensor.t3_aktivna
    - binary_sensor.t4_aktivna
  - platform: homeassistant
    event: start
  action:
  - service: input_select.select_option
    target:
      entity_id: input_select.current_tariff
    data:
      option: '{% if is_state(''binary_sensor.t1_aktivna'', ''on'') %}T1 {% elif is_state(''binary_sensor.t2_aktivna'',
        ''on'') %}T2 {% elif is_state(''binary_sensor.t3_aktivna'', ''on'') %}T3 {%
        elif is_state(''binary_sensor.t4_aktivna'', ''on'') %}T4 {% else %}T1 {% endif
        %}'
- alias: Tarifa - Notifikácia o zmene
  id: c6de83c5bbe64b99be706e78fa050e68
  description: Pošle notifikáciu pri zmene tarify
  mode: single
  trigger:
  - platform: state
    entity_id: binary_sensor.nt_aktivna
    to: 'on'
    id: nt_start
  - platform: state
    entity_id: binary_sensor.nt_aktivna
    to: 'off'
    id: nt_end
  condition:
  - condition: state
    entity_id: input_boolean.tariff_system_enabled
    state: 'on'
  action:
  - service: persistent_notification.create
    data:
      title: Zmena elektrickej tarify
      message: "{% if trigger.id == 'nt_start' %} \U0001F7E2 Začala sa NT - vhodný
        čas na zapnutie energeticky náročných zariadení {% else %} \U0001F534 Začala
        sa VT - odporúča sa obmedzenie spotreby {% endif %}"
      notification_id: tariff_change
- id: aquarium_slot1
  alias: Akvárium - Slot 1
  description: Automatizácia pre časový slot 1 - Ranné zapnutie
  mode: single
  trigger:
  - platform: time
    at: input_datetime.aquarium_slot1_time
  condition:
  - condition: state
    entity_id: input_boolean.aquarium_automation
    state: 'on'
  - condition: state
    entity_id: input_boolean.aquarium_slot1_enabled
    state: 'on'
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.aquarium_manual_override
  - service: persistent_notification.dismiss
    data:
      notification_id: aquarium_manual
  - delay:
      milliseconds: 500
  - service: script.aquarium_light_control
    data:
      brightness: '{{ states(''input_number.aquarium_slot1_brightness'') | int }}'
      color_temp: '{{ states(''input_number.aquarium_color_temp'') | int }}'
      transition: '{{ states(''input_number.aquarium_slot1_transition'') | int }}'
      slot_name: Slot 1 - Ranné zapnutie
