      = is_state('binary_sensor.t3_aktivna', 'on') %} {% set t4_active = is_state('binary_sensor.t4_aktivna',
      'on') %} {% set t1_allowed = is_state('input_boolean.klima_enable_t1', 'on')
      %} {% set t2_allowed = is_state('input_boolean.klima_enable_t2', 'on') %} {%
      set t3_allowed = is_state('input_boolean.klima_enable_t3', 'on') %} {% set t4_allowed
      = is_state('input_boolean.klima_enable_t4', 'on') %} {{ (t1_active and t1_allowed)\n
