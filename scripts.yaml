# PUSH to GitHub

git_push:
  alias: "Git - Push config"
  mode: single
  sequence:
    - service: shell_command.git_export_dashboard
    - delay: 2
    - service: shell_command.git_push_config
      data:
        message: >
          {{ states('input_text.git_commit_message') if states('input_text.git_commit_message') | length > 0 else 'dashboard update ' ~ now().strftime('%Y-%m-%d %H:%M') }}
    - delay: 3
    - service: persistent_notification.create
      data:
        title: "Git Push"
        message: "{{ states('sensor.git_push_status') }}"
        notification_id: git_push_result
    - service: input_text.set_value
      target:
        entity_id: input_text.git_commit_message
      data:
        value: ""

# PULL from GitHub
git_pull:
  alias: "Git - Pull config"
  mode: single
  sequence:
    - service: shell_command.git_pull_config
    - delay: 3
    - service: persistent_notification.create
      data:
        title: "Git Pull"
        message: "Git pull vykonaný. Skontroluj /config/www/git_pull.log a reštartuj HA."
        notification_id: git_pull_result


# AKVÁRIUM - Script pre ovládanie svetla
# Pridaj tieto riadky do existujúceho scripts.yaml súboru

aquarium_light_control:
  alias: "Akvárium - Ovládanie svetla"
  mode: restart
  fields:
    brightness:
      description: "Jas svetla (0-255)"
      example: 255
    color_temp:
      description: "Teplota farieb (mired)"  
      example: 250
    transition:
      description: "Prechod v sekundách"
      example: 300
    slot_name:
      description: "Názov slotu pre log"
      example: "Slot 1"
  sequence:
    # Kontrola či nie je manual override
    - condition: state
      entity_id: input_boolean.aquarium_manual_override
      state: 'off'
    
    # Uložiť hodnoty do pamäte
    - service: input_number.set_value
      target:
        entity_id: input_number.aquarium_last_brightness
      data:
        value: "{{ brightness | int }}"
    
    - service: input_number.set_value
      target:
        entity_id: input_number.aquarium_last_color_temp
      data:
        value: "{{ color_temp | int }}"
    
    # Log
    - service: logbook.log
      data:
        name: "Akvárium"
        message: "{{ slot_name }}: Jas {{ brightness }}, Teplota {{ color_temp }} mired, Prechod {{ transition }}s"
        entity_id: light.led_ccww_controller
    
    # Vykonať zmenu
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ brightness | int == 0 }}"
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.led_ccww_controller
              data:
                transition: "{{ transition | int }}"
      default:
        - service: light.turn_on
          target:
            entity_id: light.led_ccww_controller
          data:
            brightness: "{{ brightness | int }}"
            color_temp_kelvin: "{{ (1000000 / (color_temp | int)) | round | int }}"
            transition: "{{ transition | int }}"

# NOVÝ SCRIPT - Obnova po reštarte
aquarium_restore_state:
  alias: "Akvárium - Obnova stavu po reštarte"
  mode: single
  sequence:
    - condition: state
      entity_id: light.led_ccww_controller
      state: 'on'
    
    - service: light.turn_on
      target:
        entity_id: light.led_ccww_controller
      data:
        brightness: "{{ states('input_number.aquarium_last_brightness') | int }}"
        color_temp_kelvin: "{{ (1000000 / (states('input_number.aquarium_last_color_temp') | int)) | round | int }}"
        transition: 5
        
# VETRANIE - Script pre ovládanie stupňov
# Pridaj do scripts.yaml
#
# Logika: stupeň 0-8 → napätie 1V-9V
#   brightness = (stupeň + 1) × 25.4  (zaokrúhlené)
#   0→25, 1→51, 2→76, 3→102, 4→127, 5→152, 6→178, 7→203, 8→229

vetranie_nastav_stupen:
  alias: "Vetranie - Nastav stupeň (0-8)"
  mode: restart
  fields:
    stupen:
      description: "Stupeň vetrania (0=1V … 8=9V)"
      example: 4
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.dimdc_vetranie1
      data:
        brightness: "{{ ((stupen | int + 1) * 25.4) | round | int }}"

    - service: input_number.set_value
      target:
        entity_id: input_number.vetranie_stupen
      data:
        value: "{{ stupen | int }}"


# Zvýš stupeň o 1 (max 8)
vetranie_stupen_hore:
  alias: "Vetranie - Stupeň hore"
  mode: single
  sequence:
    - variables:
        aktualny: "{{ states('input_number.vetranie_stupen') | int }}"
    - condition: template
      value_template: "{{ aktualny < 8 }}"
    - service: script.vetranie_nastav_stupen
      data:
        stupen: "{{ aktualny + 1 }}"


# Znížiť stupeň o 1 (min 0)
vetranie_stupen_dole:
  alias: "Vetranie - Stupeň dole"
  mode: single
  sequence:
    - variables:
        aktualny: "{{ states('input_number.vetranie_stupen') | int }}"
    - condition: template
      value_template: "{{ aktualny > 0 }}"
    - service: script.vetranie_nastav_stupen
      data:
        stupen: "{{ aktualny - 1 }}"

# EV - Plná obnova nabíjania (overené 11.6.: jemný reštart NEpomohol na zaseknutý
# pilot ~6A; OCPP reset áno -> 5.9 kW). Sekvencia mirroruje ručný postup:
# OCPP reset -> počkať na reconnect -> odblok -> availability ON -> charge_control ON.
ev_restart_charging:
  alias: "EV - Obnova nabíjania (reset + štart)"
  icon: mdi:restart
  mode: single
  sequence:
    # 1) OCPP reset nabíjačky — lieči zaseknutý pilot signál
    - service: button.press
      target: { entity_id: button.hacharger_reset }
    # 2) počkaj kým charger znova nabehne (nie unavailable), max 75 s
    - wait_template: >
        {{ states('sensor.hacharger_status_connector') not in
           ['unavailable', 'unknown', 'Unavailable'] }}
      timeout: "00:01:15"
      continue_on_timeout: true
    # nech charger PLNE nabehne — inak je RemoteStart "Rejected" (overené 11.6.)
    - delay: { seconds: 15 }
    # 3) zruš blok/pauzu
    - service: input_boolean.turn_off
      target: { entity_id: input_boolean.ev_charging_blocked }
    - service: input_select.select_option
      target: { entity_id: input_select.ev_block_reason }
      data: { option: "none" }
    # 4) povoľ (Operative) a spusti transakciu
    - service: switch.turn_on
      target: { entity_id: switch.hacharger_availability }
    - delay: { seconds: 6 }
    - service: switch.turn_on
      target: { entity_id: switch.hacharger_charge_control }
      continue_on_error: true
    # 5) retry — ak ešte nenabíja, skús RemoteStart znova (prvý býva odmietnutý)
    - delay: { seconds: 12 }
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id: sensor.hacharger_status_connector
              state: "Charging"
      then:
        - service: switch.turn_on
          target: { entity_id: switch.hacharger_charge_control }
          continue_on_error: true
    - service: logbook.log
      data:
        name: "EV Control"
        message: "🔄 Obnova nabíjania: OCPP reset + štart"